<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Nota adalah catatan lokal-first yang cepat, privat, dan dibantu AI dengan API key milikmu sendiri."
    />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151513" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nota" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Nota — Catatan dengan AI</title>
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('nota-theme') || 'system'
          const dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch {
          /* noop */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Nota membutuhkan JavaScript untuk berjalan.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
